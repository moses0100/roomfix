name: roomfix
services:
  app:
    build: .
    image: roomfix-php:local
    ports: ["127.0.0.1:8003:8000"]
    volumes: [".:/app", "roomfix-vendor:/app/vendor", "./docker/php.ini:/usr/local/etc/php/conf.d/roomfix.ini:ro"]
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-roomfix}
      DB_USERNAME: roomfix
      DB_PASSWORD: ${DB_PASSWORD:-roomfix_local_only}
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roomfix
      POSTGRES_USER: roomfix
      POSTGRES_PASSWORD: ${DB_PASSWORD:-roomfix_local_only}
    volumes: ["roomfix-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomfix -d roomfix"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  roomfix-data:
  roomfix-vendor:
